name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install fish
        run: |
          sudo apt-get update
          sudo apt-get install -y fish

      - name: Syntax check
        run: |
          status=0
          for f in functions/*.fish conf.d/*.fish tests/*.fish; do
            fish -n "$f" || status=1
          done
          exit $status

      - name: Run tests
        run: fish tests/run.fish
